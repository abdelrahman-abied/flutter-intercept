<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A47"/>
      <stop offset="1" stop-color="#1B5FA8"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- request flowing in from the app -->
  <path d="M40 128 H92" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <!-- and continuing to the server -->
  <path d="M164 128 H200" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
  <path d="M186 104 L216 128 L186 152" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the intercept point: a pause badge -->
  <circle cx="128" cy="128" r="40" fill="#35D0BA"/>
  <rect x="111" y="108" width="11" height="40" rx="4" fill="#0E2A47"/>
  <rect x="134" y="108" width="11" height="40" rx="4" fill="#0E2A47"/>
</svg>
