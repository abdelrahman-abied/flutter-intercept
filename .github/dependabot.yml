version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # mockttp is pinned (~4.6.x): the proxy patches two of its internals (docs/spikes/proxy.md).
      # Upgrade deliberately, not via automated PRs.
      - dependency-name: mockttp
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
