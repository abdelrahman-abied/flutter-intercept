# Flutter Intercept IntelliJ plugin (CONTRACTS §15). Versions are pinned for reproducible builds.
pluginVersion = 0.13.0
pluginSinceBuild = 262

# The IDE to build against: a local install (nothing large is downloaded). Override with
# -PplatformLocalPath=/path/to/IDE (IntelliJ IDEA 2026.2+ with the Flutter and Dart plugins works too).
platformLocalPath = /Applications/Android Studio.app

# The Flutter and Dart plugins to compile against. Empty = the plugins folder of the local Android Studio 2026.2
# config (~/Library/Application Support/Google/AndroidStudio2026.2.1/plugins/<name>). If neither exists, the
# pinned Marketplace versions below are used.
flutterPluginPath =
dartPluginPath =
flutterPluginVersion = 97.0.0
dartPluginVersion = 510.0.0

kotlin.stdlib.default.dependency = false
org.gradle.configuration-cache = false
org.gradle.caching = true
org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
